[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "omnivoice"
version = "0.1.5"
description = "OmniVoice: Towards Omnilingual Zero-Shot Text-to-Speech with Diffusion Language Models"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [{name = "Han Zhu"}]
keywords = [
    "tts",
    "text-to-speech",
    "speech-synthesis",
    "zero-shot",
    "multilingual",
    "diffusion",
    "voice-cloning",
]
classifiers = [
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",

    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Multimedia :: Sound/Audio :: Speech",

    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "torch>=2.4",
    "torchaudio>=2.4",
    "transformers>=5.3.0",
    "accelerate",
    "pydub",
    "gradio",
    "tensorboardX",
    "webdataset",
    "numpy",
    "soundfile",
    "librosa",
    "audiotsm>=0.1.2",
    # WORLD vocoder: independent pitch/formant manipulation with prosody
    # preserved, used by the vocal-transform pre-processing on performance takes.
    "pyworld>=0.3.4",
    # pyworld imports `pkg_resources` at runtime, which ships in setuptools.
    # Modern torch only pulls setuptools in on Python >=3.12, so on the pinned
    # 3.10 it would otherwise be missing. Capped <81 (pkg_resources removed in 81).
    "setuptools>=68,<81",
    "pyloudnorm>=0.1.1",
    "fastapi>=0.135.2",
    "python-multipart>=0.0.9",
    "openai>=1.40",
    # Google Vertex AI backend for the Smart Script writer (Gemini keys that are
    # Vertex-only and can't be reached through the OpenAI-compatible shim).
    "google-genai>=1.0",
    "python-dotenv>=1.2.2",
    "uvicorn[standard]>=0.42.0",
    "einops>=0.8.2",
    "rotary-embedding-torch>=0.8.9",
    # Self-signed cert generation for --ssl (no external openssl needed).
    "cryptography>=42",
]

[project.optional-dependencies]

# Lightweight neural denoise + mild dereverb. The stronger Roformer dereverb
# technique needs no extra package (it reuses the isolation model code).
dereverb = [
    "deepfilternet>=0.5.6",
]

eval = [
    "jiwer==3.1.0",       # WER
    "s3prl",               # Speech representation (HuBERT etc.)
    "funasr",              # ASR models
    "zhconv",              # Chinese character normalization
    "zhon",                # Chinese punctuation
    "unidecode",            # Unicode normalization
]

[project.scripts]
omnivoice-infer = "omnivoice.cli.infer:main"
omnivoice-infer-batch = "omnivoice.cli.infer_batch:main"
omnivoice-demo = "omnivoice.cli.demo:main"
omnivoice-manager = "manager.server:main"

[project.urls]
Homepage = "https://github.com/SanDiegoDude/OmniVoice-Manager"
Repository = "https://github.com/SanDiegoDude/OmniVoice-Manager"
"Bug Tracker" = "https://github.com/SanDiegoDude/OmniVoice-Manager/issues"
"Upstream model (OmniVoice)" = "https://github.com/k2-fsa/OmniVoice"

[tool.uv.sources]
# Install PyTorch with CUDA support on Linux/Windows (CUDA doesn't exist for Mac).
# NOTE: We must explicitly request them as `dependencies` above. These improved
# versions will not be selected if they're only third-party dependencies.
#
# Two CUDA wheel indexes are used depending on the GPU/CPU architecture:
#  * x86_64 (and Windows): CUDA 12.8 (cu128) — the broadly-tested build.
#  * Linux ARM (aarch64): CUDA 13.0 (cu130). NVIDIA Grace-Blackwell parts such
#    as the GB10 in the "DGX Spark" report compute capability sm_121, which the
#    cu128 wheels do NOT ship kernels for (they top out at sm_120) — loading
#    them surfaces as a misleading "CUDA out of memory" on the first kernel.
#    The cu130 build includes sm_121 and runs on the CUDA 13 driver.
torch = [
  { index = "pytorch-cu130", marker = "sys_platform == 'linux' and platform_machine == 'aarch64'" },
  { index = "pytorch-cu128", marker = "(sys_platform == 'linux' or sys_platform == 'win32') and platform_machine != 'aarch64'" },
]
torchaudio = [
  { index = "pytorch-cu130", marker = "sys_platform == 'linux' and platform_machine == 'aarch64'" },
  { index = "pytorch-cu128", marker = "(sys_platform == 'linux' or sys_platform == 'win32') and platform_machine != 'aarch64'" },
]

[[tool.uv.index]]
name = "pytorch-cu128"
# PyTorch built for NVIDIA CUDA Toolkit 12.8 (x86_64 / Windows).
# Available versions: https://pytorch.org/get-started/locally/
url = "https://download.pytorch.org/whl/cu128"
# Only use this index when explicitly requested by `tool.uv.sources`.
explicit = true

[[tool.uv.index]]
name = "pytorch-cu130"
# PyTorch built for NVIDIA CUDA Toolkit 13.0 (Linux aarch64 / Grace-Blackwell).
url = "https://download.pytorch.org/whl/cu130"
# Only use this index when explicitly requested by `tool.uv.sources`.
explicit = true

[tool.uv]
constraint-dependencies = [
    # Pin the known-good PyTorch on x86_64 (Linux/Windows) and macOS (arm64).
    "torch==2.8.0; platform_machine != 'aarch64'",
    "torchaudio==2.8.0; platform_machine != 'aarch64'",
    # Linux on ARM (NVIDIA Grace/GB10 "DGX Spark", GH200, …): pulled from the
    # cu130 index (see [tool.uv.sources]). 2.8.0 has no aarch64 CUDA wheels at
    # all (the index jumps 2.7.x -> 2.9.x), and the first version shipping both
    # torch and torchaudio aarch64 wheels is 2.10.0.
    "torch==2.10.0; platform_machine == 'aarch64'",
    "torchaudio==2.10.0; platform_machine == 'aarch64'",
    # pyworld imports pkg_resources, removed from setuptools>=81.
    "setuptools<81",
]

[tool.hatch.build.targets.sdist]
include = ["omnivoice", "manager"]

[tool.hatch.build.targets.wheel]
packages = ["omnivoice", "manager"]
